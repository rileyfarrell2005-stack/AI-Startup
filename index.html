<section id="booking" data-view hidden>
  <a class="back-link" href="#services">← Back to technicians</a>
  <div class="page-heading"><p class="eyebrow">Request a quote</p><h1>Tell the technician what's wrong.</h1><p class="lead" id="booking-technician"></p></div>
  <form class="form-card" id="booking-form">
    <label>Your name<input name="customer" required maxlength="60" autocomplete="given-name" placeholder="First name"></label>
    <label>Area (city or neighbourhood)<input name="area" required maxlength="80" placeholder="e.g. Antigonish"></label>
    <label>Appliance<select name="appliance" required><option value="">Choose appliance</option><option>Refrigerator</option><option>Washer</option><option>Dryer</option><option>Dishwasher</option><option>Oven / stove</option><option>Other</option></select></label>
    <label>Preferred date<input name="preferredDate" id="preferred-date" type="date" required></label>
    <label>Preferred time<select name="preferredTime" required><option value="">Choose a time</option><option>Morning (8 AM–12 PM)</option><option>Afternoon (12 PM–4 PM)</option><option>Evening (4 PM–8 PM)</option><option>Any available time</option></select></label>
    <label>When do you need help?<select name="timing" required><option>As soon as possible</option><option>Within a few days</option><option>Flexible</option></select></label>
    <label class="wide-field">Briefly describe the problem<textarea name="description" required maxlength="600" rows="4" placeholder="What is the appliance doing (or not doing)?"></textarea></label>
    <button class="button" type="submit">Send quote request <span aria-hidden="true">→</span></button>
    <p class="form-note">The technician will respond with a quote in this demo. You can decide whether to accept it.</p>
    <p id="booking-status" class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>
